name: CI/CD (Render)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: maven

    - name: Build backend
      working-directory: backend
      run: |
        chmod +x mvnw
        ./mvnw -B -DskipTests package

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      working-directory: frontend
      env:
        VITE_API_BASE_URL: /api
      run: |
        npm ci
        npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: maven

    - name: Run backend tests
      working-directory: backend
      run: |
        chmod +x mvnw
        ./mvnw -B test

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Run frontend lint & test
      working-directory: frontend
      run: |
        npm ci
        npm run lint || echo "Lint failed, but continuing..."
        # npm test # Раскомментируй, если добавишь тесты на фронт

  deploy:
    name: Deploy
    needs: [ build, test ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Trigger Render Deploy (Backend)
      if: secrets.RENDER_BACKEND_DEPLOY_HOOK != ''
      run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

    - name: Trigger Render Deploy (Frontend)
      if: secrets.RENDER_FRONTEND_DEPLOY_HOOK != ''
      run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"

  healthcheck:
    name: Healthcheck
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Wait and Probe Health
      run: |
        # Используем базовый URL фронтенда для проверки проксирования
        URL="${{ secrets.APP_HEALTHCHECK_URL }}"
        echo "Checking health for $URL/api/actuator/health"

        for i in {1..20}; do
          # Проверяем статус через API-путь
          RESPONSE=$(curl -s "$URL/api/actuator/health" || true)
          if echo "$RESPONSE" | grep -q '"status":"UP"'; then
            echo "Healthcheck passed!"
            exit 0
          fi
          echo "Attempt $i: App is not ready yet, retrying in 15s..."
          sleep 15
        done
        echo "Healthcheck timed out."
        exit 1
