name: CI/CD (Render)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: maven

    - name: Build backend
      working-directory: backend
      run: |
        chmod +x mvnw
        ./mvnw -B -DskipTests package

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      working-directory: frontend
      env:
        VITE_API_BASE_URL: /api
      run: |
        npm ci
        npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: maven

    - name: Run backend tests
      working-directory: backend
      run: |
        chmod +x mvnw
        ./mvnw -B test

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Run frontend lint
      working-directory: frontend
      run: |
        npm ci
        npm run lint || echo "Lint failed"

  deploy:
    name: Deploy
    needs: [ build, test ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
    steps:
    - name: Trigger Render Deploy (Backend)
      if: env.RENDER_BACKEND_DEPLOY_HOOK != ''
      run: curl -fsS -X POST "${{ env.RENDER_BACKEND_DEPLOY_HOOK }}"

    - name: Trigger Render Deploy (Frontend)
      if: env.RENDER_FRONTEND_DEPLOY_HOOK != ''
      run: curl -fsS -X POST "${{ env.RENDER_FRONTEND_DEPLOY_HOOK }}"

  healthcheck:
    name: Healthcheck
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      APP_HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL }}
    steps:
    - name: Wait and Probe Health
      run: |
        if [ -z "${APP_HEALTHCHECK_URL}" ]; then
          exit 0
        fi

        URL="${APP_HEALTHCHECK_URL%/}"

        for i in {1..20}; do
          RESPONSE=$(curl -s "$URL/api/actuator/health" || true)
          if echo "$RESPONSE" | grep -q '"status":"UP"'; then
            exit 0
          fi
          sleep 15
        done
        exit 1
