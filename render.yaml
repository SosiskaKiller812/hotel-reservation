version: 1 # Это поле часто забывают, но оно обязательно
services:
# Backend (Java Spring Boot)
- type: web
  name: spring-backend
  env: docker
  region: frankfurt # Рекомендую указать регион (например, frankfurt ближе к РБ)
  plan: free
  dockerContext: ./backend
  dockerfilePath: ./backend/Dockerfile
  envVars:
  - key: SPRING_DATASOURCE_URL
    fromDatabase:
      name: hotel-db # Имя должно совпадать с названием в блоке databases
      property: connectionString
  - key: SPRING_REDIS_URL # Spring Boot проще переварит полную строку подключения
    fromService:
      type: redis
      name: hotel-cache
      property: connectionString

# Frontend (React)
- type: web
  name: react-frontend
  env: docker
  region: frankfurt
  plan: free
  dockerContext: ./frontend
  dockerfilePath: ./frontend/Dockerfile
  envVars:
  - key: REACT_APP_API_URL
    # Важно: URL будет доступен только после первого деплоя. 
    # Если имя сервиса 'spring-backend', то URL будет:
    value: https://spring-backend.onrender.com

# База данных
databases:
- name: hotel-db
  plan: free
  region: frankfurt

# Redis
redis:
- name: hotel-cache
  plan: free
  region: frankfurt
  ipAllowList: [] # По умолчанию разрешает доступ только внутри сети Render
